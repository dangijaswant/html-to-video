<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --card: #ffffff;
        --ink: #1a1a1a;
        --muted: #8a8a8a;
        --track: #e8e8e8;
        --fill: #2a2a2a;
        --shadow: 0 28px 60px rgba(0, 0, 0, 0.22);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: transparent;
        font-family: "Manrope", sans-serif;
        color: var(--ink);
      }

      #root {
        width: 1920px;
        height: 1080px;
        background: transparent;
        display: grid;
        place-items: center;
      }

      .player {
        width: 300px;
        background: var(--card);
        border-radius: 28px;
        padding: 22px 18px 22px;
        box-shadow: var(--shadow);
        overflow: hidden;
        opacity: 1;
      }

      .carousel {
        display: grid;
        grid-template-columns: 1fr 1.28fr 1fr;
        align-items: center;
        gap: 8px;
        width: 100%;
        margin-bottom: 18px;
      }

      .cover {
        width: 100%;
        aspect-ratio: 1;
        border-radius: 14px;
        overflow: hidden;
        opacity: 0.55;
        transform: scale(0.96);
        box-shadow: 0 6px 14px rgba(0, 0, 0, 0.08);
      }

      .cover.is-active {
        opacity: 1;
        transform: scale(1);
        box-shadow: 0 12px 24px rgba(0, 0, 0, 0.15);
        border-radius: 16px;
      }

      .ph {
        width: 100%;
        height: 100%;
        display: block;
      }

      .ph-a {
        background: linear-gradient(145deg, #94a3b8, #64748b);
      }

      .ph-b {
        background: linear-gradient(145deg, #f87171, #b91c1c 55%, #7f1d1d);
      }

      .ph-c {
        background: linear-gradient(145deg, #60a5fa, #1d4ed8);
      }

      .meta {
        text-align: center;
        margin-bottom: 16px;
      }

      .title {
        font-size: 1.55rem;
        font-weight: 800;
        letter-spacing: -0.03em;
        line-height: 1.1;
        margin-bottom: 4px;
      }

      .subtitle {
        font-size: 0.9rem;
        font-weight: 500;
        color: var(--muted);
        line-height: 1.3;
      }

      .progress-block {
        margin-bottom: 16px;
      }

      .times {
        display: flex;
        justify-content: space-between;
        font-size: 0.8rem;
        font-weight: 600;
        color: #555;
        margin-bottom: 8px;
        font-variant-numeric: tabular-nums;
      }

      .bar {
        height: 3px;
        background: var(--track);
        border-radius: 999px;
        overflow: hidden;
      }

      .bar-fill {
        height: 100%;
        width: 0%;
        background: var(--fill);
        border-radius: inherit;
      }

      .controls {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 28px;
      }

      .icon {
        width: 40px;
        height: 40px;
        display: grid;
        place-items: center;
        color: var(--ink);
      }

      .icon.play {
        width: 44px;
        height: 44px;
      }

      .icon svg {
        width: 22px;
        height: 22px;
      }

      .icon.play svg {
        width: 26px;
        height: 26px;
      }
    </style>
  </head>
  <body>
    <!-- Exact 3:00 realtime export @ 30fps = 5400 frames -->
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="180"
      data-width="1920"
      data-height="1080"
      data-fps="30"
    >
      <article
        id="player"
        class="player clip"
        data-start="0"
        data-duration="180"
        data-track-index="0"
        aria-label="Music player"
      >
        <div class="carousel" aria-label="Album art">
          <div class="cover"><span class="ph ph-a"></span></div>
          <div class="cover is-active"><span class="ph ph-b"></span></div>
          <div class="cover"><span class="ph ph-c"></span></div>
        </div>

        <div class="meta">
          <h1 class="title" id="songTitle">Sheep</h1>
          <p class="subtitle" id="songDesc">Chomp 2<br />Russ</p>
        </div>

        <div class="progress-block">
          <div class="times">
            <span id="currentTime">0:00</span>
            <span id="totalTime">3:00</span>
          </div>
          <div class="bar">
            <div class="bar-fill" id="progressFill"></div>
          </div>
        </div>

        <div class="controls">
          <div class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M6 6h2.2v12H6V6zm3.2 6 10.8 7V5L9.2 12z" />
            </svg>
          </div>
          <div class="icon play" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M7 5h3.5v14H7V5zm6.5 0H17v14h-3.5V5z" />
            </svg>
          </div>
          <div class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M15.8 6H18v12h-2.2V6zM4 19l10.8-7L4 5v14z" />
            </svg>
          </div>
        </div>
      </article>
    </div>

    <script>
      const SONG_SECONDS = 180;
      const currentEl = document.getElementById("currentTime");
      const fillEl = document.getElementById("progressFill");
      const state = { t: 0 };

      function formatTime(sec) {
        const s = Math.max(0, Math.min(SONG_SECONDS, Math.floor(sec)));
        const m = Math.floor(s / 60);
        const r = s % 60;
        return m + ":" + String(r).padStart(2, "0");
      }

      function applyProgress() {
        fillEl.style.width = (state.t / SONG_SECONDS) * 100 + "%";
        currentEl.textContent = formatTime(state.t);
      }

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Exact 1:1 timing — 180s of video = 0:00 → 3:00 on the bar
      tl.fromTo(
        state,
        { t: 0 },
        {
          t: SONG_SECONDS,
          duration: SONG_SECONDS,
          ease: "none",
          onUpdate: applyProgress,
        },
        0
      );

      applyProgress();
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
