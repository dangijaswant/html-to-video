<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b1220" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>HTML → Video Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css?v=8" />
  </head>
  <body>
    <div class="app">
      <header class="top">
        <div class="brand">HTML → <span>VIDEO</span> Studio</div>
        <div class="badge">Free HQ engine · Cloudflare Worker + GitHub Actions</div>
      </header>

      <div class="main">
        <section class="panel panel-compose">
          <h2>Composition HTML</h2>
          <div class="toolbar">
            <button type="button" id="loadMusic">Load music player</button>
            <button type="button" id="loadAether">Load Aether</button>
            <button type="button" id="refreshPreview">Refresh preview</button>
          </div>
          <div class="song-config">
            <label>
              Song name
              <input id="songName" type="text" value="Sheep" autocomplete="off" />
            </label>
            <label>
              Description
              <textarea id="songDescInput" rows="2" spellcheck="true">Chomp 2
Russ</textarea>
            </label>
            <button type="button" id="applySongMeta">Apply to HTML</button>
          </div>
          <textarea id="editor" spellcheck="false" aria-label="HTML composition"></textarea>
        </section>

        <section class="panel panel-preview">
          <h2>Preview</h2>
          <p class="hint">
            Checkerboard = transparency. Preview auto-plays the GSAP timeline (scaled to fit).
          </p>
          <div class="preview-wrap">
            <iframe id="preview" title="Composition preview"></iframe>
          </div>
        </section>

        <section class="panel panel-export">
          <h2>Export settings</h2>
          <div class="form">
            <div class="form-row">
              <label>
                Width
                <input id="width" type="number" inputmode="numeric" min="64" max="3840" step="2" value="1920" />
              </label>
              <label>
                Height
                <input id="height" type="number" inputmode="numeric" min="64" max="2160" step="2" value="1080" />
              </label>
            </div>
            <div class="form-row">
              <label>
                FPS
                <input id="fps" type="number" inputmode="numeric" min="1" max="60" value="30" />
              </label>
              <label>
                Duration (seconds)
                <input id="duration" type="number" inputmode="decimal" min="0.5" max="180" step="0.5" value="15" />
              </label>
            </div>
            <div class="checks">
              <label><input type="checkbox" name="fmt" value="webm" checked /> WebM VP9 alpha (HQ)</label>
              <label><input type="checkbox" name="fmt" value="webp" checked /> WebP lossless</label>
              <label><input type="checkbox" name="fmt" value="mov" /> ProRes 4444 MOV</label>
              <label><input type="checkbox" name="fmt" value="mov-premul" /> ProRes premul (CapCut)</label>
            </div>
            <button class="primary" type="button" id="exportBtn">Export HQ</button>
          </div>

          <div class="progress-block">
            <div class="bar" aria-hidden="true"><i id="progressFill"></i></div>
            <div id="statusText">Ready. Exports use the real HyperFrames + FFmpeg pipeline.</div>
          </div>

          <div class="downloads" id="downloads"></div>
        </section>
      </div>
    </div>
    <script>
      // Inline so a cached config.js cannot break Export HQ
      window.STUDIO_API_BASE =
        "https://html-to-video-api.jaswantdangi00.workers.dev";
    </script>
    <script src="./config.js?v=12"></script>
    <script src="./app.js?v=12"></script>
  </body>
</html>
