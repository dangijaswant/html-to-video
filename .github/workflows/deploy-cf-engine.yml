name: Deploy Cloudflare Engine

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "cf-engine/**"
      - ".github/workflows/deploy-cf-engine.yml"

concurrency:
  group: cf-engine
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: cf-engine
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cf-engine/package-lock.json

      - uses: docker/setup-buildx-action@v3

      - name: Install deps
        run: npm ci

      - name: Deploy Worker + Container
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --outdir=dist

      - name: Print routes
        run: npx wrangler deployments list 2>/dev/null || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
