name: Deploy Cloudflare Engine

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "cf-engine/**"
      - ".github/workflows/deploy-cf-engine.yml"

concurrency:
  group: cf-engine
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: cf-engine
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cf-engine/package-lock.json

      - uses: docker/setup-buildx-action@v3

      - name: Install deps
        run: npm ci

      - name: Configure Wrangler OAuth
        env:
          WRANGLER_OAUTH_CONFIG: ${{ secrets.WRANGLER_OAUTH_CONFIG }}
        run: |
          mkdir -p "$HOME/.config/.wrangler/config"
          # Also cover XDG path used on some runners
          mkdir -p "$HOME/.local/share/xdg.config/.wrangler/config" 2>/dev/null || true
          printf '%s\n' "$WRANGLER_OAUTH_CONFIG" > "$HOME/.config/.wrangler/config/default.toml"
          if [ -d "$HOME/.local/share/xdg.config" ]; then
            mkdir -p "$HOME/.local/share/xdg.config/.wrangler/config"
            cp "$HOME/.config/.wrangler/config/default.toml" "$HOME/.local/share/xdg.config/.wrangler/config/default.toml"
          fi
          npx wrangler whoami

      - name: Deploy Worker + Container
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Show worker URL
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deployments list || true
